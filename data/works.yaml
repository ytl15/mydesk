- id: saturn
  place: shelf
  solid: true
  title: "纵观土星"
  sub: "在时间与永恒之间 · 中英对照加注全译本"
  stage: "2026 年 8 月 · 正文译毕"
  spine:
    label: "纵观土星"
    w: 3.0
    h: 11.8
    color: "#565061"
  cells: "ffffff"
  cite: >-
    Charles Obert，<i>Saturn Through the Ages: Between Time and Eternity</i>，Almuten Press, Minneapolis, 2019 · 248 页
  key: >-
    <b>正文 pp. 10–244 全部译毕</b>（235 页；未译的是卷前书名页与卷末索引）· 899 个对照单元 · 215 条注释 · <b>210 条术语契约</b>。格子一格是一卷：卷首、第一部历史巡礼、第二部永恒法则、第三部土星主题诸论、结语、附录
  blurb: >-
    一位执业占星师写给同行的书。上半部把土星的含义从瓦伦斯、菲尔米库斯、阿布·马沙尔一路点到丽兹·格林与福里斯特，看它如何随世界观的改变而改变；下半部转向柏拉图，问那个更硬的问题：如果时间之外真有不变的法则，土星就不只是限制，而是永恒在时间里留下的边界。
  next: >-
    全书术语契约表（§0，210 条）置于正文之前，与《天宫图与公共领域》旧表对齐，分歧四处均注明理由。中文为正文，英文原文与五类注释均可一键开合，全文不用 JavaScript。
  links:
    - label: "阅读全书"
      href: "translation/saturn.html"
      primary: true
    - label: "术语契约表"
      href: "translation/saturn.html#sec-gl"
