- id: cycle
  place: shelf
  solid: true
  title: "岁轮"
  sub: "传统预测占星学 · 中英对照加注全译本"
  stage: "2026 年 8 月 · 全书译毕"
  spine:
    label: "岁轮"
    byline: "Charles Obert"
    w: 2.9
    h: 10.8
    color: "#8a6134"
  cells: "ffffff"
  cite: >-
    Charles Obert，<i>The Cycle of the Year: Traditional Predictive Astrology</i>，Benjamin N. Dykes 序，Almuten Press, 2018
  key: >-
    <b>全书译毕</b>（原书 pp. 9–155）· 957 个对照单元 · 357 条注释 · 82 幅星盘与图表 · <b>155 条译名契约</b>。格子一格是一卷：卷首、第一部立论与准备、第二部岁轮的诸层级、第三部上手、第四部结语与附录、术语契约表
  blurb: >-
    一年之内，什么时候该发生什么？奥伯特把传统预测的几套技法叠成一座金字塔：底下是小限法这样的粗刻度，往上是太阳回归、主限推运，最细的一层是行运。它们不是彼此竞争的流派，而是同一段时间的不同倍率——先看哪一年要紧，再看要紧在哪一处。书末用亨德里克斯、梅尔维尔、梦露、拿破仑、安杰卢等人的盘逐个走一遍。
  next: >-
    与《纵观土星》共用一套术语，两书的契约表可互查。另有六讲读书课课件，尚未上站。
  links:
    - label: "阅读全书"
      href: "translation/cycle-of-the-year.html"
      primary: true
    - label: "术语契约表"
      href: "translation/cycle-of-the-year.html#sec-gl"
