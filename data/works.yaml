- id: cabala
  place: shelf
  solid: true
  form: pouch
  title: "占星诸宫的卡巴拉"
  sub: "自拉丁直接译出 · 沃顿英译作《占星十二宫的卡巴拉》 · 1623／1661 两本对读"
  stage: "2026 年 8 月 · 全篇译毕"
  spine:
    label: "占星诸宫的卡巴拉"
    byline: "Jean-Baptiste Morin"
    w: 2.6
    h: 9.8
    color: "#6d5b97"
  cells: ~
  cite: >-
    Jean-Baptiste Morin，<i>Astrologicarum domorum cabala detecta</i>，巴黎：J. Moreau，1623，pp.3–38；同文改本见 <i>Astrologia Gallica</i>，Lib. XVII, Sect. I，海牙：A. Vlacq，1661，pp.384–390
  key: >-
    单篇文章，不是书，故不画进度格。<b>两本全文对读</b> · 57 个对照单元（两本皆有 35、文字有异 10、仅 1623 有 7、仅 1661 有 5）· 37 条注释（内校记 23 条）· <b>35 条术语契约</b>，承《纵观土星》—《岁轮》那份 155 条的旧约，一条不改，只做增补
  blurb: >-
    同一篇文章，莫兰前后写了两遍，中间隔了三十八年。1623 年那本薄册是四十岁的他从蒙彼利埃之围返回巴黎途中「揭出」的；1661 年的《高卢占星学》第十七卷第一节删去数论与布道口吻，添上经院式的第二重证明。沃顿 1683 年译入英文的是前一本——英语世界读到的是四十岁的莫兰，欧陆读到的是晚年的莫兰，两条线不同源。本版把两本并置，中译自拉丁直接出，不经沃顿英译。
  next: >-
    顶栏「只看差异」一键隐去两本相同的段落，剩下的就是莫兰三十八年间改动过的地方。另有一版走沃顿英译的四层对读加注稿，尚未上站；1661 年本末尾那章神学附论另篇独出。
  links:
    - label: "阅读全篇"
      href: "translation/morin-cabala.html"
      primary: true
    - label: "术语契约表"
      href: "translation/morin-cabala.html#sec-gl"

