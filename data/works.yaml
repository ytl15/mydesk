# data/works.yaml —— 由「小书桌」页面导出。覆盖仓库中同名文件后重新构建。
# place: shelf 书架 / drawer 归档抽屉 / desk 台面
# solid: true 实体书脊 / false 虚体（书架上留一格空位）
# form: pouch 文件袋（不是书的东西：单篇、一叠散稿）；不写就是书脊
# spine.byline: 书脊侧面那列小字 —— 作者原名，或「论文集」
# cells: 每字符一格 —— f 译毕、h 节译或残稿、e 未译；~ 表示不画进度格

