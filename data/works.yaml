  key: >-
    <b>正文 pp. 10–244 全部译毕</b>（235 页；未译的是卷前书名页与卷末索引）· 899 个对照单元 · 215 条注释 · <b>210 条术语契约</b>。格子一格是一卷：卷首、第一部历史巡礼、第二部永恒法则、第三部土星主题诸论、结语、附录
