# data/notes.yaml —— 便签。place: desk 贴在台面上
- id: n1
  place: desk
  title: "怎么分辨人译的和机器填的"
  from: "现存 planets-manifest.md · 尚未上站"
  body: >-
    《行星之内》原 PDF 对同一批页面译了好几轮，还夹着大段生成的填充文字。可信译文紧贴原文推进，出现具体人名书名、拉丁原文与注释序号，行文往往生硬；生成填充文从字顺却无实质内容，爱用「我们已经探索了……」的口吻，并以原书所无的小标题起首。
- id: n2
  place: desk
  title: "AI 参与到什么程度，为什么要说出来"
  from: "现存 content/translation/_index.md"
  body: >-
    初译、术语比对与转录由 AI 做；选书、定体例、逐处判断由我做，并为最终译文负责。也因此所有译文都尽量可查证：原文与译文逐段对照，术语另列，译名取舍写入凡例。
- id: n3
  place: desk
  title: "格子为什么按序号排"
  from: "体例说明 · 待写"
  body: >-
    因为从哪儿开工是有意义的。《塔罗冥想》从第十五封「恶魔」起手，不是从第一封——把实心格堆在最前面就把这件事抹掉了。
